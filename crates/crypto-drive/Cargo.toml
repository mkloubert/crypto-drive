[package]
name = "crypto-drive"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "crypto-drive"
path = "src/main.rs"

[dependencies]
crypto-drive-core = { path = "../crypto-drive-core" }
crypto-drive-fuse = { path = "../crypto-drive-fuse" }
clap = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
nix = { workspace = true }
rpassword = { workspace = true }
secrecy = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }

[dev-dependencies]
crypto-drive-core = { path = "../crypto-drive-core", features = ["test-util"] }
tempfile = { workspace = true }
