[package]
name = "crypto-drive-fuse"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# macOS: fuser must not mount itself (its fuse_mount_compat25 call fails
# with macFUSE 5.5); src/macos_mount.rs mounts via libfuse fuse_mount().
# macfuse-4-compat is needed for the macFUSE 4+ wire format (for example the
# flags field in RENAME); fuser only turns it on by itself when it mounts
# through libfuse, which macos-no-mount switches off.
fuser = { workspace = true, features = ["macos-no-mount", "macfuse-4-compat"] }

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { workspace = true }

[dependencies]
crypto-drive-core = { path = "../crypto-drive-core" }
libc = { workspace = true }
nix = { workspace = true }
log = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
rustix = { workspace = true }
crypto-drive-core = { path = "../crypto-drive-core", features = ["test-util"] }
